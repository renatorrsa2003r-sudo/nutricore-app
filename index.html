<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NutriCore Pro</title>

  <link rel="icon" type="image/png" href="[https://cdn-icons-png.flaticon.com/512/3063/3063169.png](https://cdn-icons-png.flaticon.com/512/3063/3063169.png)">
  <link rel="apple-touch-icon" href="[https://cdn-icons-png.flaticon.com/512/3063/3063169.png](https://cdn-icons-png.flaticon.com/512/3063/3063169.png)">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NutriCore">

  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">

  <style>
    :root {
      --bg-main: #f8fafc; --bg-card: #ffffff; --bg-sidebar: #0f172a;
      --text-main: #1e293b; --text-muted: #64748b; --accent: #10b981;
      --accent-hover: #059669; --border: #e2e8f0; --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
    aside { width: 250px; background-color: var(--bg-sidebar); color: #fff; display: flex; flex-direction: column; padding: 24px 16px; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: 700; color: #10b981; margin-bottom: 32px; }
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; color: #94a3b8; font-weight: 500; cursor: pointer; }
    .nav-item.active { background-color: var(--accent); color: #fff; }
    .mobile-nav { display: none; }
    main { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card { background: var(--bg-card); border-radius: 12px; padding: 20px; border: 1px solid var(--border); box-shadow: var(--card-shadow); margin-bottom: 16px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-main); color: var(--text-main); font-size: 0.95rem; outline: none; }
    button.btn-primary { background: var(--accent); color: white; border: none; padding: 12px 18px; font-size: 0.95rem; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; }
    .meal-card, .exercise-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 12px; }
    #loading, #loading-treino { display: none; text-align: center; padding: 30px; }
    .spinner { font-size: 2rem; color: var(--accent); animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @media (max-width: 768px) {
      body { flex-direction: column; height: 100dvh; }
      aside { display: none; }
      main { padding: 14px; padding-bottom: 80px; }
      .grid-2 { grid-template-columns: 1fr; }
      .mobile-nav { display: flex; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg-card); border-top: 1px solid var(--border); justify-content: space-around; padding: 10px 0; z-index: 999; }
      .mob-nav-btn { display: flex; flex-direction: column; align-items: center; font-size: 0.65rem; color: var(--text-muted); cursor: pointer; gap: 3px; background: none; border: none; }
      .mob-nav-btn.active { color: var(--accent); font-weight: 700; }
    }
  </style>
</head>
<body>

  <aside>
    <div class="brand"><i class="fa-solid fa-leaf"></i> NutriCore Pro</div>
    <ul class="nav-list">
      <li class="nav-item active" onclick="switchTab('perfil')"><i class="fa-solid fa-user"></i> Perfil</li>
      <li class="nav-item" onclick="switchTab('dieta')"><i class="fa-solid fa-utensils"></i> Dieta</li>
      <li class="nav-item" onclick="switchTab('treino')"><i class="fa-solid fa-dumbbell"></i> Treino</li>
      <li class="nav-item" onclick="switchTab('configuracoes')"><i class="fa-solid fa-gear"></i> Configurações</li>
    </ul>
  </aside>

  <main>
    <!-- PERFIL -->
    <section id="tab-perfil" class="tab-content active">
      <h1 style="margin-bottom: 12px;">Meu Perfil</h1>
      <form id="profileForm">
        <div class="card">
          <div class="grid-2">
            <div class="form-group"><label>Idade</label><input type="number" id="idade" value="28" required></div>
            <div class="form-group"><label>Sexo</label><select id="sexo"><option value="masculino">Masculino</option><option value="feminino">Feminino</option></select></div>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>Peso (kg)</label><input type="number" step="0.1" id="peso" value="78.0" required></div>
            <div class="form-group"><label>Altura (cm)</label><input type="number" id="altura" value="178" required></div>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>Atividade</label><select id="nivel_atividade"><option value="moderado" selected>Moderado</option><option value="sedentario">Sedentário</option><option value="intenso">Intenso</option></select></div>
            <div class="form-group"><label>Objetivo</label><select id="objetivo"><option value="perda_peso">Emagrecimento</option><option value="hipertrofia">Hipertrofia</option></select></div>
          </div>
          <div class="form-group"><label>Refeições/dia</label><select id="refeicoes_por_dia"><option value="3">3 Refeições</option><option value="4" selected>4 Refeições</option></select></div>
          <button type="submit" class="btn-primary"><i class="fa-solid fa-wand-magic-sparkles"></i> Gerar Plano Alimentar</button>
        </div>
      </form>
    </section>

    <!-- DIETA -->
    <section id="tab-dieta" class="tab-content">
      <h1 style="margin-bottom: 12px;">Plano Nutricional</h1>
      <div id="loading"><i class="fa-solid fa-circle-notch spinner"></i><p style="margin-top: 8px;">Montando cardápio com IA...</p></div>
      <div id="lista-refeicoes"></div>
    </section>

    <!-- TREINO -->
    <section id="tab-treino" class="tab-content">
      <h1 style="margin-bottom: 12px;">Treino Personalizado</h1>
      <div class="card">
        <form id="formTreino">
          <div class="grid-2">
            <div class="form-group"><label>Nível</label><select id="treino-nivel"><option value="iniciante">Iniciante</option><option value="intermediario" selected>Intermediário</option><option value="avancado">Avançado</option></select></div>
            <div class="form-group"><label>Foco</label><select id="treino-foco"><option value="hipertrofia" selected>Hipertrofia</option><option value="emagrecimento">Emagrecimento / Queima</option></select></div>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>Equipamento</label><select id="treino-equipamento"><option value="academia" selected>Academia</option><option value="peso_corporal">Peso Corporal</option></select></div>
            <div class="form-group"><label>Duração (min)</label><select id="treino-tempo"><option value="30">30 min</option><option value="45" selected>45 min</option><option value="60">60 min</option></select></div>
          </div>
          <button type="submit" class="btn-primary"><i class="fa-solid fa-dumbbell"></i> Gerar Treino</button>
        </form>
      </div>
      <div id="loading-treino"><i class="fa-solid fa-circle-notch spinner"></i><p style="margin-top: 8px;">Criando sequência de treino...</p></div>
      <div id="resultado-treino"></div>
    </section>

    <!-- CONFIGURAÇÕES -->
    <section id="tab-configuracoes" class="tab-content">
      <h1 style="margin-bottom: 12px;">Configurações</h1>
      <div class="card">
        <div class="form-group">
          <label>Chave API Gemini</label>
          <input type="password" id="gemini-key" placeholder="Cole sua chave aqui">
        </div>
        <button class="btn-primary" onclick="salvarConfiguracoes()">Salvar Chave</button>
      </div>
    </section>
  </main>

  <nav class="mobile-nav">
    <button class="mob-nav-btn active" onclick="switchTab('perfil')"><i class="fa-solid fa-user"></i><span>Perfil</span></button>
    <button class="mob-nav-btn" onclick="switchTab('dieta')"><i class="fa-solid fa-utensils"></i><span>Dieta</span></button>
    <button class="mob-nav-btn" onclick="switchTab('treino')"><i class="fa-solid fa-dumbbell"></i><span>Treino</span></button>
    <button class="mob-nav-btn" onclick="switchTab('configuracoes')"><i class="fa-solid fa-gear"></i><span>Config</span></button>
  </nav>

  <script>
    function switchTab(id) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.mob-nav-btn, .nav-item').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + id).classList.add('active');
      
      const idx = ['perfil', 'dieta', 'treino', 'configuracoes'].indexOf(id);
      if (idx >= 0) {
        document.querySelectorAll('.nav-item')[idx]?.classList.add('active');
        document.querySelectorAll('.mob-nav-btn')[idx]?.classList.add('active');
      }
    }

    async function safeFetch(url, payload) {
      const apiKey = localStorage.getItem('gemini_api_key');
      if (apiKey) payload.gemini_api_key = apiKey;

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const rawText = await res.text();

      // Se a resposta for HTML em vez de JSON (página de erro do Render ou cold start)
      if (rawText.trim().startsWith('<') || rawText.includes('<!DOCTYPE')) {
        throw new Error("O servidor do Render está acordando ou reiniciando. Aguarde 30 segundos e tente novamente.");
      }

      let data;
      try {
        data = JSON.parse(rawText);
      } catch (e) {
        throw new Error("Resposta inválida do servidor.");
      }

      if (!res.ok) {
        throw new Error(data.detail || "Erro ao processar solicitação.");
      }
      return data;
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const loading = document.getElementById('loading');
      loading.style.display = 'block';
      switchTab('dieta');
      try {
        const payload = {
          idade: parseInt(document.getElementById('idade').value),
          sexo: document.getElementById('sexo').value,
          peso_kg: parseFloat(document.getElementById('peso').value),
          altura_cm: parseFloat(document.getElementById('altura').value),
          nivel_atividade: document.getElementById('nivel_atividade').value,
          objetivo: document.getElementById('objetivo').value,
          refeicoes_por_dia: parseInt(document.getElementById('refeicoes_por_dia').value)
        };
        const data = await safeFetch('/api/v1/diet/generate', payload);
        let html = `<div class="card" style="border-left:4px solid var(--accent);"><h3>Meta: ${data.meta_calorica} kcal</h3><p>Proteínas: ${data.macros.proteinas_g}g | Carbos: ${data.macros.carboidratos_g}g | Gorduras: ${data.macros.gorduras_g}g</p></div>`;
        data.refeicoes.forEach(r => {
          html += `<div class="meal-card"><h4>${r.nome_refeicao}: ${r.titulo_prato}</h4><p style="font-size:0.85rem;color:var(--text-muted);margin:4px 0;">${r.horario_sugerido} - ~${r.calorias_alvo} kcal</p><ul style="margin:8px 0 8px 18px;font-size:0.9rem;">${r.ingredientes.map(i=>`<li>${i}</li>`).join('')}</ul><p style="font-size:0.85rem;"><strong>Preparo:</strong> ${r.modo_preparo}</p></div>`;
        });
        document.getElementById('lista-refeicoes').innerHTML = html;
      } catch (err) {
        alert(err.message);
      } finally {
        loading.style.display = 'none';
      }
    });

    document.getElementById('formTreino').addEventListener('submit', async (e) => {
      e.preventDefault();
      const loading = document.getElementById('loading-treino');
      loading.style.display = 'block';
      document.getElementById('resultado-treino').innerHTML = '';
      try {
        const payload = {
          nivel: document.getElementById('treino-nivel').value,
          foco: document.getElementById('treino-foco').value,
          equipamento: document.getElementById('treino-equipamento').value,
          tempo_minutos: parseInt(document.getElementById('treino-tempo').value)
        };
        const data = await safeFetch('/api/v1/workout/generate', payload);
        let html = `<div class="card" style="border-left:4px solid var(--accent);margin-top:14px;"><h3>${data.titulo}</h3><p style="font-size:0.85rem;color:var(--text-muted);">Foco: ${data.foco_principal}</p></div>`;
        if (data.treino_principal) {
          html += `<div class="card"><h4>Exercícios Principais</h4>`;
          data.treino_principal.forEach(ex => {
            html += `<div class="exercise-card"><strong>${ex.nome}</strong>: ${ex.series} séries de ${ex.repeticoes}<br><small style="color:var(--text-muted)">Descanso: ${ex.descanso} | Dica: ${ex.dica_tecnica}</small></div>`;
          });
          html += `</div>`;
        }
        document.getElementById('resultado-treino').innerHTML = html;
      } catch (err) {
        alert(err.message);
      } finally {
        loading.style.display = 'none';
      }
    });

    function salvarConfiguracoes() {
      const k = document.getElementById('gemini-key').value.trim();
      if (k) {
        localStorage.setItem('gemini_api_key', k);
        alert('Chave salva com sucesso!');
      } else {
        alert('Digite uma chave válida.');
      }
    }

    window.onload = () => {
      const k = localStorage.getItem('gemini_api_key');
      if (k) document.getElementById('gemini-key').value = k;
    };
  </script>
</body>
</html>
